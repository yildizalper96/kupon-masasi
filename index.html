<script>/* Ilk acilis (20 Kas 2026):
 * 1) Veri dosyalari (data/*.json): kritik kucukler once agdan (en fazla 0,8 sn), buyukler cihazdaki son kopyadan (service worker onbellegi) ANINDA; kopya 3 saatten eskiyse agdan.
 * 2) Ana icerik, ilk ekranin tum verisi ve ekrandaki logolar hazir olunca TEK SEFERDE gosterilir (yukleniyor yazisi, ara durum yok). En fazla 3 sn.
 * 3) Gosterildikten hemen sonra ayni dosyalar agdan taze istenir; yalniz degisen varsa veri yeniden yuklenir ve ekran TEK KEZ guncellenir. */
window.__fxWait=true;(function(){
var P=[],ac=0,BU={},of=window.fetch.bind(window),ESKI=3*3600e3;
window.kmBootCache=('caches' in window)&&!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
var KRT=/data\/(fixtures\/latest|fixtures\/finished|results\/latest|results\/stats|history\/all|teams\/ids)\.json/;
/* kucuk ve kritik dosyalar (maclar, skorlar, sonuclar): once ag, en fazla 0,8 sn; gelmezse cihazdaki kopya. Buyukler (ayrinti, kadro, oyuncu): cihazdaki kopya aninda, acildiktan sonra arka planda taze. */
window.fetch=function(u,o){try{var s=typeof u==="string"?u:(u&&u.url)||"";if(window.kmBootCache&&/(^|\/)data\/[^?]*\.json(\?|$)/.test(s)){var ab=new URL(s,location.href).href;var kopya=function(){return caches.match(ab).then(function(h){var d=h&&Date.parse(h.headers.get("date")||"");return h&&(!d||Date.now()-d<ESKI)?h:null})};if(KRT.test(ab)){var ag=of(u,o);return Promise.race([ag.then(function(r){if(!r.ok)throw 0;return r}),new Promise(function(r,x){setTimeout(x,800)})]).catch(function(){return kopya().then(function(h){if(h){BU[ab]=1;return h}return ag})})}return kopya().then(function(h){if(h){BU[ab]=1;return h}return of(u,o)}).catch(function(){return of(u,o)})}}catch(e){}return of(u,o)};
window.kmBoot=function(p){P.push(Promise.resolve(p).catch(function(){}));return p};
function kapiAc(){var s=document.getElementById("kmgate");if(s)s.remove();window.kmBootCache=false;setTimeout(taze,50)}
function ac1(){if(ac)return;ac=1;try{if(typeof render==="function")render()}catch(e){}setTimeout(function(){var im=[].slice.call(document.querySelectorAll("#app img,#dz img")).filter(function(i){return !i.complete});if(!im.length){kapiAc();return}Promise.race([Promise.all(im.map(function(i){return new Promise(function(r){i.addEventListener("load",r);i.addEventListener("error",r)})})),new Promise(function(r){setTimeout(r,1500)})]).then(function(){setTimeout(kapiAc,16)})},20)}
function taze(){var L=Object.keys(BU);if(!L.length)return;Promise.all(L.map(function(u){return caches.match(u).then(function(h){return h?h.text():null}).then(function(eski){return of(u,{cache:"no-cache"}).then(function(r){return r.ok?r.text():eski}).then(function(t){return t!==eski})}).catch(function(){return false})})).then(function(d){if(!d.some(Boolean))return;var Y=window.kmReloaders||[];window.kmHold=true;Promise.all(Y.map(function(f){try{return Promise.resolve(f()).catch(function(){})}catch(e){}})).then(function(){window.kmHold=false;window.kmHoldP=0;try{var y=window.scrollY;render();window.scrollTo(0,y)}catch(e){}})})}
window.kmBootOpen=ac1;
document.addEventListener("DOMContentLoaded",function(){setTimeout(function(){Promise.race([Promise.all(P),new Promise(function(r){setTimeout(r,3000)})]).then(ac1)},0)})})()</script>
