# Veriyi API-Football'dan ceker, siteyi paketler ve GitHub Pages'e yayinlar.
#  - canli mod: her 20 dk, yalnizca 10:00-22:59 UTC; bilinen mac oynanmiyorsa canli istek yapilmaz
#  - tam mod: gunde 3 kez (3 tarih + en fazla 4 yeni mac tahmini); ardindan mac ayrintilari (en cok 14 istek)
#  - mac ayrintilari (tools/fetch-details.mjs): milli takim kadro listesi, ilk 11 (mactan ~100 dk once), oran, eksik, karsilikli
#  - kod degisince (push): veri cekmeden yeniden yayinlar
#  - elle: Actions sekmesinden "Run workflow" (mod secilir)
# Ucretsiz plan gunluk 100 istek: en kotu durumda ~39..78 + 44 -> arac her calistirmada /status ile (sayilmaz)
# kalan kotaya bakar ve 10'un altindaysa hic istek yapmaz.
name: Veri güncelle ve yayınla

on:
  schedule:
    - cron: '*/20 10-22 * * *'
    - cron: '7 6,13,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Veri modu'
        type: choice
        default: full
        options: [full, live, none]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Onbellek geri yuklenince depodaki YENI veri eskisiyle ezilmesin: once depodaki kopyayi sakla, sonra birlestir
      - name: Depodaki veriyi sakla
        run: mkdir -p .repo-data/players && cp -r data/fixtures data/teams .repo-data/ 2>/dev/null || true; cp data/players/season.json .repo-data/players/ 2>/dev/null || true

      # Veri ve tahmin onbellegi calistirmalar arasinda korunur
      - name: Önbelleği geri yükle
        uses: actions/cache@v4
        with:
          path: |
            data/fixtures
            data/teams
            data/players/season.json
            tools/cache
          key: fx-${{ github.run_id }}
          restore-keys: fx-

      - name: Önbellek ve depoyu birleştir (yeni olan kazanır)
        run: node tools/merge-restored.mjs .repo-data

      - name: Veri çek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE=none
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "*/20 10-22 * * *" ]; then MODE=live; else MODE=full; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-full}"
          fi
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::API_FOOTBALL_KEY secret tanımlı değil, veri çekilmedi."
            MODE=none
          fi
          if [ "$MODE" = "live" ] && [ ! -f data/fixtures/latest.json ]; then MODE=full; fi
          echo "Mod: $MODE"
          # Ucretsiz plan gunluk 100 istek: once maclar/canli skor, sonra ayrintilar (kadro listesi, ilk 11, oran, eksik, karsilikli)
          if [ "$MODE" = "full" ]; then
            node tools/fetch-fixtures.mjs --max-pred=4
            # --reserve: kalan kota bunun altina inerse ayrintilar (kadro listesi, oran, karsilikli) durur;
            # yalnizca ilk 11 yedek kotaya girebilir. Boylece mac gunu canli skor ve ilk 11 icin kota kalir.
            node tools/fetch-details.mjs --max=14 --hours=24 --reserve=45 || true
          fi
          if [ "$MODE" = "live" ]; then
            node tools/fetch-fixtures.mjs --live
            node tools/fetch-details.mjs --max=14 --hours=24 --reserve=45 || true
          fi

      # Supabase ucretsiz projesi 1 hafta islem olmazsa durur: zamanli calistirmalarda hafif bir okuma yap
      - name: Supabase canlılık denemesi
        if: github.event_name == 'schedule'
        run: node tools/keepalive.mjs

      - name: Siteyi paketle
        run: node tools/build-site.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
