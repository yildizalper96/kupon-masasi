# Veriyi API-Football'dan ceker, siteyi paketler ve GitHub Pages'e yayinlar.
#  Pro plan (21 Kas 2026, 7500/gun). Asil cekim yerel bilgisayarda; bu is yedek. Kod push edilince veri cekmeden yeniden yayinlar.
name: Veri güncelle ve yayınla

on:
  # YEDEK (21 Kas 2026, Pro plan): asil cekim kullanicinin bilgisayarinda (tools/yerel-tetik, ev IP'si).
  # GitHub IP'leri ortak; yerel veri 75 dk'dan tazeyse API'ye istek atilmaz (asagida 'Depodaki veri yasi').
  # Bu zamanlayiciyi, yerine baska otomatik cekim acmadan KAPATMA (21 Kas olayi: docs/ayrinti.md).
  schedule:
    - cron: '*/20 * * * *'
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Veri modu'
        type: choice
        default: full
        options: [full, live, none, due]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Onbellek geri yuklenince depodaki YENI veri eskisiyle ezilmesin: once depodaki kopyayi sakla, sonra birlestir
      - name: Depodaki veriyi sakla
        run: mkdir -p .repo-data/players && cp -r data/fixtures data/teams .repo-data/ 2>/dev/null || true; cp data/players/season.json .repo-data/players/ 2>/dev/null || true

      # Veri ve tahmin onbellegi calistirmalar arasinda korunur
      - name: Önbelleği geri yükle
        uses: actions/cache@v4
        with:
          path: |
            data/fixtures
            data/teams
            data/players/season.json
            tools/cache
          key: fx-${{ github.run_id }}
          restore-keys: fx-

      - name: Önbellek ve depoyu birleştir (yeni olan kazanır)
        run: node tools/merge-restored.mjs .repo-data

      - name: Veri çek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE=none
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "*/20 * * * *" ]; then MODE=live; else MODE=full; fi
            # yerel bilgisayar calisiyorsa (depodaki veri 75 dk'dan taze; yerel sessiz saatlerde saatte bir push eder) GitHub istek atmaz, yalnizca yayinlar
            YAS=$(node -e "try{const d=require('./.repo-data/fixtures/latest.json');console.log(Math.round((Date.now()-Date.parse(d.at))/60000))}catch(e){console.log(9999)}")
            echo "Depodaki veri yasi: $YAS dk"
            if [ "$YAS" -lt 75 ]; then echo "Yerel cekim calisiyor (veri taze), API istegi yok."; MODE=none; fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-full}"
          fi
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::API_FOOTBALL_KEY secret tanımlı değil, veri çekilmedi."
            MODE=none
          fi
          if [ "$MODE" = "due" ] && [ ! -f data/fixtures/latest.json ]; then MODE=full; fi
          if [ "$MODE" = "live" ] && [ ! -f data/fixtures/latest.json ]; then MODE=full; fi
          echo "Mod: $MODE"
          # Ucretsiz plan gunluk 100 istek: once maclar/canli skor, sonra ayrintilar (kadro listesi, ilk 11, oran, eksik, karsilikli)
          if [ "$MODE" = "full" ]; then
            node tools/fetch-fixtures.mjs --max-pred=4
            # --reserve: kalan kota bunun altina inerse ayrintilar (kadro listesi, oran, karsilikli) durur;
            # yalnizca ilk 11 yedek kotaya girebilir. Boylece mac gunu canli skor ve ilk 11 icin kota kalir.
            node tools/fetch-details.mjs --max=300 --hours=36 --reserve=1500 --squads=40 || true
          fi
          # due: dis servis (cron-job.org) 5-10 dk'da bir tetikler; yalnizca vakti gelmis ilk 11 / ilk yari / mac sonu istegi yapilir
          if [ "$MODE" = "due" ]; then
            node tools/fetch-details.mjs --phases-only --max=80 --hours=3 --reserve=500 || true
          fi
          if [ "$MODE" = "live" ]; then
            node tools/fetch-fixtures.mjs --live
            node tools/fetch-details.mjs --max=150 --hours=36 --reserve=1500 || true
          fi

      # Supabase ucretsiz projesi 1 hafta islem olmazsa durur: zamanli calistirmalarda hafif bir okuma yap
      - name: Supabase canlılık denemesi
        if: github.event_name == 'schedule'
        run: node tools/keepalive.mjs

      # Biten maclar puan tablosu / form icin sezon kaydina (data/history/all.json, results/latest.json); istek yok
      - name: Biten maçları sezon kaydına ekle
        run: node tools/sonuc-ekle.mjs || true

      # Guc modeli: tum sonuclardan takim gucu -> yaklasan maclarin gol beklentisi (data/model/guc.json); istek yok
      - name: Güç modelini hesapla
        run: node tools/model-guc.mjs || true

      - name: Siteyi paketle
        run: node tools/build-site.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
